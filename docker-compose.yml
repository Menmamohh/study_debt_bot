version: '3.8'

services:
  bot:
    build: .
    container_name: study_debt_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/debts.db
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

